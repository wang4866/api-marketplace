[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-proxy"
version = "0.1.0"
description = "Turn your local Ollama into a production-ready OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Hermes Agent"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ollama", "llm", "openai-api", "local-ai", "proxy"]
dependencies = ["httpx>=0.27", "click>=8.0", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/wang4866/api-marketplace"
Repository = "https://github.com/wang4866/api-marketplace"

[project.scripts]
local-ai = "local_ai_proxy.cli:cli"

[tool.setuptools.packages.find]
include = ["local_ai_proxy*"]

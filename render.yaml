services:
  - type: web
    name: api-marketplace
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMA_BASE
        value: http://ollama-service:11434
      - key: PYTHON_VERSION
        value: 3.11
